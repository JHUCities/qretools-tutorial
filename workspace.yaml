# This workspace's settings. Lessons 16, 17 and 33 come
# back here.

# The DDI agency: the registered code of the
# organization that looks after these questions. Every
# DDI identifier includes it. Lesson 33 comes back to
# it; leave it for now.
agency: org.example

# Lesson 16: fields every question must have, as well
# as name, text and intent. Remove the # at the start of
# the next two lines (Cmd-/ does it).
required:
  - title

# Lesson 17: fields one folder's questions must also
# have. Remove the # at the start of the next three
# lines.
required_in:
  questions/lesson17_required_in:
    - universe
