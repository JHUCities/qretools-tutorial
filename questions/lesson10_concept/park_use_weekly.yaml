# ── Lesson 10 of 33: a shared concept ──
#
# What this shows: a concept is the idea a question
# measures. Questions that measure the same thing name
# the same shared concept, so they can be found
# together. Here the concept is written out in words,
# not named, so there's a warning.
#
# To do:
#   1. In the Findings list, apply "Make it a shared
#      concept use_of_local_parks". Confirm the name,
#      and the label it suggests.
#   2. Its file opens with  label:  filled in. You can
#      add a  definition:  if you like, such as: How
#      often, and for what, residents go to the parks
#      near their home.
#
# Done when: park_use_weekly has a green tick.
name: park_use_weekly
title: Uses a park weekly
text: In a typical week, do you spend time in a park in this neighborhood?
intent: Estimates the share of residents who use local parks every week, a measure of regular use.
concept: use_of_local_parks
responses: yes_no
