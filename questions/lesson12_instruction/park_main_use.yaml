name: park_main_use
title: Main use of the park
text: What do you mostly do when you visit a park here?
intent: Describes what residents mainly use local parks for, to match facilities to their uses.
responses:
  "1": Walk or run
  "2": Play a sport
  "3": Relax or read
  "4": Bring children to play
  "5": Something else
