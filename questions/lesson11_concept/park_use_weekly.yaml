# ── Lesson 11 of 35: a shared concept ──
#
# A concept is the idea that a question measures.
# Questions that measure the same idea use the name of
# the same shared concept. You can then find those
# questions together. This question gives the concept in
# words, and not as a name, so QREtools shows a warning.
#
# To do:
#   1. In the Findings list, apply "Make it a shared
#      concept use_of_local_parks". Confirm the name and
#      the label.
#   2. The concept is now under Shared → Concepts. Open
#      the concept, and add a  definition: , such as:
#      How often, and for what, residents go to the
#      parks near their home.
#   3. Three other questions measure the same idea:
#      park_visited, park_visit_frequency and
#      park_visit_days. Open each question, and give it
#      the same concept. The inspector then tells you
#      that four questions use the concept.
#
# Done when: park_use_weekly has a green tick.
name: park_use_weekly
title: Uses a park weekly
text: In a typical week, do you spend time in a park in this neighborhood?
intent: Estimates the share of residents who use local parks every week, a measure of regular use.
concept: Use of local parks
responses: yes_no
