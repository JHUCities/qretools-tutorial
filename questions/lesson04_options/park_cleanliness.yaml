# ── Lesson 4 of 35: response options ──
#
# A question can give the respondent options. Each
# option has a code and a label. The data stores the
# code. The respondent reads the label. Put each code in
# quotation marks, "1", to keep the code exactly as you
# write it.
#
# To do:
#   1. Option "2" has no label. Write  Fairly clean
#      after its colon.
#   2. Add a third option on a new line. Indent the line
#      two spaces, as the other options are indented:
#        "3": Not clean
#
# Done when: park_cleanliness has a green tick.
name: park_cleanliness
title: Park cleanliness
text: How clean are the parks in this neighborhood?
intent: Measures how residents judge the upkeep of local parks, a likely reason to visit or stay away.
responses:
  "1": Very clean
  "2":
