# ── Lesson 9 of 33: a new shared scale ──
#
# What this shows: if you name a scale that doesn't
# exist yet, QREtools offers to make it.
#
# To do:
#   1. frequency5 is underlined: no shared scale has
#      that name. In the Findings list, click "New
#      shared scale frequency5". In the dialog, press
#      Create.
#   2. Its file opens with options "1" and "2", without
#      labels. Label them, then add "3" to "5" below,
#      indented the same:
#        "1": Every day
#        "2": Every week
#        "3": Every month
#        "4": Less often
#        "5": Never
#   3. Come back here (the browser's Back button).
#
# Done when: park_visit_frequency, and frequency5 under
# Shared → Scales, have green ticks. Then save
# park_visit_frequency: while frequency5 is unsaved,
# "with scale frequency5" beside Save says it's saved
# too.
name: park_visit_frequency
title: How often parks are visited
text: How often do you visit a park in this neighborhood?
intent: Estimates how often residents use local parks, from daily users to those who never go.
responses: frequency5
