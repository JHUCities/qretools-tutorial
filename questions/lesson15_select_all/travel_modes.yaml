# ── Lesson 15 of 36: select all that apply ──
#
# The field  select: many  lets the respondent tick
# every option that applies. Each option in this file
# has a label and a short title. The respondent reads
# the label. In the data, each option is a variable, and
# the title is the label of that variable. Lesson 20
# shows how the data stores the options.
#
# The warning asks for a "None of these" option. Without
# that option, the data cannot show the difference
# between two respondents. One respondent ticks no
# option, because no option applies. The other
# respondent does not answer the question.
#
# To do:
#   1. Add a fifth option at the end, with the same
#      indentation as the other options:
#        "5":
#          label: None of these
#          title: None
#
# Done when: travel_modes has a green tick.
name: travel_modes
title: Ways of getting to the park
text: How do you get to a park here?
intent: Describes how residents reach local parks, to plan paths, cycle racks and bus stops.
access: public
instruction: select_all
select: many
responses:
  "1":
    label: On foot
    title: Walk
  "2":
    label: By bicycle
    title: Bicycle
  "3":
    label: By bus
    title: Bus
  "4":
    label: By car
    title: Car
