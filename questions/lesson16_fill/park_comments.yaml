# ── Lesson 16 of 36: a fill ──
#
# A fill puts words from an earlier answer into the
# text. Write a fill in double braces: {{rating}}. The
# question gives the type of words that each fill takes.
# The instrument gives the source of the words. Lesson
# 27 shows the instrument.
#
# To do:
#   1. The name rating is underlined, because the
#      question does not declare it. Add these lines at
#      the end of the file:
#        fills:
#          rating: text
#
# Done when: park_comments has a green tick. The
# respondent preview then shows the position of the
# fill.
name: park_comments
title: Comments on the parks
text: 'You said you were "{{rating}}" with the parks. What makes you feel that way?'
intent: Collects the reasons behind each resident's satisfaction rating, in their own words.
access: public
open: { max_length: 500 }
