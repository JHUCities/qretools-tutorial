# Done when: park_wishes has a green tick.
name: park_wishes
title: Wishes for the parks
text: If you could change one thing about the parks here, what would it be?
intent: Collects residents' own ideas for improving local parks, in their words, to guide planning.
access: public
open: { max_length: 500 }
