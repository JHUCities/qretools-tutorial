# ── Lesson 6 of 36: a free-text question ──
#
# An open question takes the answer in the respondent's
# own words.
#
# To do:
#   1. Type  op  on a new line at the end of the file.
#      Completion offers  open . If completion does not
#      show, press Cmd-I on a Mac, or Ctrl-Space on
#      other systems. Select  open .
#   2. Completion writes  open:  and, on the next line,
#        max_length: . The cursor moves to that line.
#      Type  500 . max_length is the length of the
#      longest answer, in characters.
