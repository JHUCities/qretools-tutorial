# ── Lesson 26 of 35: else, and else if ──
#
# else gives the steps for all other conditions. An else
# holds a list of steps, with dashes. An else can also
# hold one more if, without a dash, to test a different
# condition. This instrument has one more if. The
# operator  in {…}  tests for more than one code.
#
# To do:
#   1. Write this condition after the second  if: :
#      bank.park_visit_frequency in {"3", "4"} . The
#      code "3" is at least once a month. The code "4"
#      is less than once a month.
#
# Done when: this instrument has a green tick.
name: lesson26_else_if
uses:
  bank: ../
flow:
  - ask: bank.park_visit_frequency
  - if: bank.park_visit_frequency in {"1", "2"}
    then:
      - say: Thank you. You're one of the parks' regular visitors.
    else:
      if: bank.park_visit_frequency in {"3", "4"}
      then:
        - say: Thank you. You visit now and then.
      else:
        - say: Thank you. We'd like to know what keeps you away.
