# ── Lesson 31 of 33: checks ──
#
# What this shows: a check tests an answer as it's
# given. Its severity says what happens when it fails:
#   info      shows its message as a remark;
#   blocking  they can't go on until it passes;
#   warning   shows its message as a warning.
# A check can read more than one answer, which is what
# catches answers that contradict each other. min and
# max already keep a number in range, so a check is for
# what they can't see. isnull(x) is true when x has no
# answer.
#
# To do:
#   1. After the empty  ensure:  write
#      bank.household_size < 10
#
# Done when: this instrument has a green tick.
name: lesson31_checks
uses:
  bank: ../
flow:
  - ask: bank.household_size
    checks:
      - ensure: bank.household_size < 10
        severity: warning
        message: That's a large household. Is that right?
  - ask: bank.park_visit_frequency
  - ask: bank.park_visit_days
    checks:
      - name: agrees_with_frequency
        ensure: not (bank.park_visit_frequency = "5" and bank.park_visit_days > 0)
        severity: blocking
        message: You said you never visit a park here. Please give 0 days, or change that answer.
      - ensure: not isnull(bank.park_visit_days)
        severity: info
        message: An answer helps us plan, but you can skip it.
