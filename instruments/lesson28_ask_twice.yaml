# ── Lesson 28 of 33: a question that you ask twice ──
#
# A question that you ask twice stores two answers with
# one name. That is the red error in this instrument,
# and it is correct. The field  as  gives the second
# answer a different name.
#
# If you ask one question before and after you tell the
# respondent something, that is an experiment. You then
# compare the two answers.
#
# To do:
#   1. Add this line below the second
#      - ask: bank.park_satisfaction , in line with ask:
#        as: park_satisfaction_after
#
# Done when: this instrument has a green tick.
name: lesson28_ask_twice
uses:
  bank: ../
flow:
  - ask: bank.park_satisfaction
  - say: Some parks here have new benches and lights this year.
  - ask: bank.park_satisfaction
