# ── Lesson 30 of 33: a roster that asks for more ──
#
# What this shows: a roster can keep going while the
# answer to "another?" is Yes, up to max rounds. Lesson
# 29 knew the count before it started; here you don't,
# so you ask after each round. each then goes back over
# the rounds and can show their answers, to check them.
#
# max caps the rounds: here, someone who visited a
# park every day of the month describes only five
# visits.
#
# To do:
#   1. After  more:  write  bank.another_park = "1"
#
# Done when: this instrument has a green tick.
name: lesson30_more
uses:
  bank: ../
flow:
  - ask: bank.park_visited
  - if: bank.park_visited = "1"
    then:
      - roster: parks
        more:
        max: 5
        flow:
          - say: Now about park {{index}}.
          - ask: bank.visit_minutes
            universe: bank.park_visitors
          - ask: bank.another_park
            universe: bank.park_visitors
      - say: Please check what you told us.
      - each: parks
        flow:
          - say: At park {{index}} you stay about {{bank.visit_minutes}} minutes.
