# ── Lesson 33 of 36: checks ──
#
# A check tests an answer when the respondent gives it.
# The severity of the check gives the result of a
# failure:
#   info      shows the message as a remark;
#   warning   shows the message as a warning;
#   blocking  stops the respondent until the check
#             passes.
# A check can read more than one answer. A check that
# reads two answers finds answers that disagree. min and
# max keep a number in its range, so use a check for the
# errors that min and max cannot find. The function
# isnull(x) is true when x has no answer.
#
# To do:
#   1. Write  bank.household_size < 10  after the empty
#      ensure: .
#
# Done when: this instrument has a green tick.
name: lesson33_checks
uses:
  bank: ../
flow:
  - ask: bank.household_size
    checks:
      - ensure: bank.household_size < 10
        severity: warning
        message: That's a large household. Is that right?
  - ask: bank.park_visited
  - ask: bank.park_visit_days
    checks:
      - name: agrees_with_visiting
        ensure: not (bank.park_visited = "2" and bank.park_visit_days > 0)
        severity: blocking
        message: You said you haven't visited a park here in the past month, so this should be 0.
      - ensure: not isnull(bank.park_visit_days)
        severity: info
        message: An answer helps us plan, but you can skip it.
