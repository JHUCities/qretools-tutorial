# ── Lesson 24 of 33: if, then ──
#
# What this shows: if asks some questions only when a
# condition is true.
#
# To do:
#   1. After  if:  write  bank.park_visited = "1" (Yes).
#   2. The blue note on  - ask: bank.park_safety  says
#      only some people reach it, but its universe says
#      everyone. Under that line, lined up with "ask", add:
#        universe: bank.park_visitors
#
# Done when: this instrument has a green tick.
name: lesson24_branch
uses:
  bank: ../
flow:
  - ask: bank.park_visited
  - if: bank.park_visited = "1"
    then:
      - ask: bank.park_safety
        universe: bank.park_visitors
