# ── Lesson 23 of 36: a first instrument ──
#
# Part 2. An instrument is a survey. The instrument
# gives the questions to ask, their order, and the
# persons to ask. This instrument asks the questions
# that you wrote in Part 1.
#
#   - uses gives the source of the questions. The name
#     "bank" is this workspace (../).
#   - flow lists the steps. Each step starts with a
#     dash.
#   - say shows words to the respondent.
#   - ask asks a question. Write the question as
#     bank.<name of the question>.
#
# The Outline on the right shows the flow. Click a step
# to go to that step.
#
# To do:
#   1. The second ask is empty. Click the button after
#      ask, and select a question. You can also type
#      bank.park_visited .
#
# Done when: lesson23_first_instrument has a green tick
# under Instruments.
name: lesson23_first_instrument
title: A first instrument
description: Welcomes the respondent, asks for consent, then asks one question.
# The persons that the whole survey is for.
universe: bank.all_respondents
uses:
  bank: ../
flow:
  - say: Thank you for taking part in this survey about the parks in your neighborhood.
  - ask: bank.consent
  - ask: bank.park_visited
