# ── Lesson 25 of 33: else, and else if ──
#
# What this shows: else says what happens otherwise. It
# holds a list of steps (with dashes), or one more if
# (no dash) to test something else, as below. in {…}
# tests for any of several codes.
#
# To do:
#   1. After the second  if:  write
#      bank.park_visit_frequency in {"3", "4"} (at least
#      once a month, or less than once a month).
#
# Done when: this instrument has a green tick.
name: lesson25_else_if
uses:
  bank: ../
flow:
  - ask: bank.park_visit_frequency
  - if: bank.park_visit_frequency in {"1", "2"}
    then:
      - say: Thank you. You're one of the parks' regular visitors.
    else:
      if: bank.park_visit_frequency in {"3", "4"}
      then:
        - say: Thank you. You visit now and then.
      else:
        - say: Thank you. We'd like to know what keeps you away.
