# ── Lesson 27 of 35: a computed value ──
#
# compute calculates a value from the answers, and gives
# the value a name. Later steps can then use the value.
# Combine conditions with and, or and not.
#
# To do:
#   1. Write this value after  value: :
#        bank.park_visit_days >= 8 and bank.park_nearby = "1"
#      8 days in 30 days is approximately two days each
#      week.
#
# Done when: this instrument has a green tick.
name: lesson27_compute
universe: bank.all_respondents
uses:
  bank: ../
flow:
  - ask: bank.park_nearby
  - ask: bank.park_visit_days
  - compute: frequent_nearby
    value: bank.park_visit_days >= 8 and bank.park_nearby = "1"
  - if: frequent_nearby
    then:
      - say: You visit a park often, and there's one near you.
