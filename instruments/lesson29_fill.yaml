# ── Lesson 29 of 35: a fill in the text of a question ──
#
# The question park_comments in lesson 16 has a fill,
# {{rating}}. This instrument gives the source of the
# words: the answer to the satisfaction question. The
# function label(…) gives the words of the answer, such
# as "Very satisfied". It does not give the code, "1".
#
# To do:
#   1. Write  label(bank.park_satisfaction)  after
#      rating: .
#
# Done when: this instrument has a green tick.
name: lesson29_fill
uses:
  bank: ../
flow:
  - ask: bank.park_satisfaction
  - ask: bank.park_comments
    fill:
      rating: label(bank.park_satisfaction)
