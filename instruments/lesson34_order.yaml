# ── Lesson 34 of 36: order, time and inputs ──
#
#   - inputs are the values that you know before the
#     interview, such as the wave of the survey. Use an
#     input as you use an answer.
#   - a section groups steps. The setting  order: random
#     puts the steps of the section in a random order.
#   - on an ask, the setting  options: random  puts the
#     options in a random order. The setting  seconds
#     gives the time that the question must take. Use
#     seconds to plan the survey.
#
# To do:
#   1. Write  random  after  order: , or select it with
#      the button after order.
#
# Done when: this instrument has a green tick.
name: lesson34_order
uses:
  bank: ../
inputs:
  wave:
    number: { min: 1, max: 4 }
    description: The wave of the survey, from the sample file.
flow:
  - section: About the parks
    order: random
    flow:
      - ask: bank.park_cleanliness
      - ask: bank.park_together
      - ask: bank.park_main_use
        options: random
        seconds: 15
  - say: This is wave {{wave}} of the survey. Thank you for taking part again.
