# ── Lesson 31 of 36: a roster ──
#
# A roster asks the same questions one time for each of
# several things. This roster asks about each person in
# the household. count gives the quantity of times. The
# value {{index}} is the number of the round, such as
# person 1 or person 2.
#
# To do:
#   1. Write  bank.household_size  after  count: .
#
# Done when: this instrument has a green tick.
name: lesson31_roster
uses:
  bank: ../
flow:
  - ask: bank.household_size
  - roster: people
    count:
    flow:
      - say: The next question is about person {{index}}.
      - ask: bank.member_age
