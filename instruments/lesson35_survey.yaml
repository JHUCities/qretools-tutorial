# ── Lesson 35 of 36: the full survey ──
#
# This instrument is a full survey. It uses what you
# learned.
#
# To do:
#   1. Fill in the two dashed circles: the condition of
#      the stop, and the question in the branch
#      (park_main_use).
#   2. Look at the DDI pane on the right. The button
#      Download DDI saves the survey in DDI. DDI is the
#      standard for the documentation of surveys. The
#      button Download QSF saves the survey for
#      Qualtrics. In Qualtrics, select Projects →
#      Create project → Survey → Import a QSF file.
#   3. Look at the names in the DDI pane. Each one
#      starts with the agency you set in lesson 1. In
#      your own workspace, use your organization's code.
#
# Done when: this instrument has a green tick. Then go
# to lesson 36, the last lesson.
name: lesson35_survey
title: Neighborhood parks
description: How residents use, judge and would improve the parks in their neighborhood.
universe: bank.all_respondents
uses:
  bank: ../
flow:
  - say: Thank you for taking part in this survey about the parks in your neighborhood.
  - ask: bank.consent
  - stop: bank.consent = "2"
    say: Thank you for your time.
  - ask: bank.park_nearby
  - ask: bank.park_visited
  - if: bank.park_visited = "1"
    then:
      - ask: bank.park_main_use
        universe: bank.park_visitors
      - ask: bank.park_visit_days
        universe: bank.park_visitors
      - ask: bank.travel_modes
        universe: bank.park_visitors
  - ask: bank.park_satisfaction
  - ask: bank.park_comments
    fill:
      rating: label(bank.park_satisfaction)
  - ask: bank.household_size
  - say: Thank you. That's the end of the survey.
