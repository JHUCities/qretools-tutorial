# ── Lesson 23 of 33: stop ──
#
# stop ends the survey for the persons that the survey
# is not for. It also shows them a message. In this
# instrument, the condition of the stop compares an
# answer with one of its codes. Put the code in
# quotation marks.
#
# stop ends the full survey, so stop goes in the main
# flow of the instrument only. Do not put stop in an if,
# in an else, or in a section.
#
# To do:
#   1. Write  bank.consent = "2"  after  stop: . The
#      code "2" is No in the question consent.
#
# Done when: this instrument has a green tick.
name: lesson23_stop
uses:
  bank: ../
flow:
  - ask: bank.consent
  - stop: bank.consent = "2"
    say: Thank you for your time.
  - ask: bank.park_visited
