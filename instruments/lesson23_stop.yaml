# ── Lesson 23 of 33: stop ──
#
# What this shows: stop ends the survey for people it
# isn't for, with a message to them. Here its condition
# compares an answer with one of its codes, in quotes.
# Because it ends the whole survey, stop goes only in
# the instrument's main flow: not under if, else or a
# section.
#
# To do:
#   1. After  stop:  write  bank.consent = "2"
#      (consent's code for No).
#
# Done when: this instrument has a green tick.
name: lesson23_stop
uses:
  bank: ../
flow:
  - ask: bank.consent
  - stop:
    say: Thank you for your time.
  - ask: bank.park_visited
