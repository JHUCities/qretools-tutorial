# ── Lesson 32 of 36: a roster that asks for more ──
#
# A roster can continue while the answer to "another?"
# is Yes, to a maximum of max rounds. Lesson 31 knew the
# quantity of rounds before the roster started. This
# roster does not know it, so it asks after each round.
# each then goes through the rounds again, and can read
# their answers back.
#
# max is the limit of the rounds. In this instrument, a
# respondent who visited more than five parks tells you
# about five parks.
#
# To do:
#   1. Write  bank.another_park = "1"  after  more: .
#
# Done when: this instrument has a green tick.
name: lesson32_more
uses:
  bank: ../
flow:
  - ask: bank.park_visited
  - if: bank.park_visited = "1"
    then:
      - roster: parks
        more:
        max: 5
        flow:
          - say: Now about park {{index}}.
          - ask: bank.visit_minutes
            universe: bank.park_visitors
          - ask: bank.another_park
            universe: bank.park_visitors
      - each: parks
        flow:
          - say: At park {{index}} you stay about {{bank.visit_minutes}} minutes.
