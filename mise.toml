# The tools that check this workspace, at fixed versions, so `mise install` gives
# everyone the same ones. Check the workspace with `qretools check .`.
[tools]
node = "26"
# allow_low_downloads: mise refuses an npm package under 30 days old unless allowed.
# qretools is JHUCities' own. Remove this after 2026-12-06.
# Lesson 28 uses `cast`, which the command understands from 2.0.0-alpha.4.
"npm:qretools" = { version = "2.0.0-alpha.4", allow_low_downloads = true }
